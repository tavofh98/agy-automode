# Política del auto mode de agy.
#
# Este archivo es la única pieza que necesitas editar para ajustar el comportamiento.
# Lo lee `pretooluse.py` en cada llamada a herramienta.
#
# Las cadenas van entre comillas simples ('...') para que las barras invertidas de las
# expresiones regulares se tomen literales y no haya que duplicarlas.

[mode]
# Modo de operación simplificado:
# "plan" -> solo lectura, git de consulta y ejecución de python exploratorio. Edición de código pide confirmación.
# "auto" -> autonomía prácticamente total. Edición de código libre, comandos evaluados por clasificador.
active = "auto"

# Sigue la conversación: la fase se deduce de lo que escribe la persona, de modo que
# el modo plan de este auto mode y el `/plan` de agy queden gobernados por el mismo
# acto. El payload del hook no expone el modo de agy —sus campos comunes son
# conversationId, workspacePaths, transcriptPath, artifactDirectoryPath y modelName—,
# así que el disparador compartido es el mensaje, no el estado interno de agy.
#
# Precedencia: la variable AGY_MODE gana sobre esto, y esto gana sobre `active`.
follow_conversation = true

# Acompaña cada `allow` sobre un comando con una concesión temporal
# `permissionOverrides: ["command(<el comando>)"]`. Sin esto, en el modo plan de agy
# un `allow` del hook no siempre evita que agy pida confirmación por su cuenta.
# Concede el comando exacto ya aprobado, no un prefijo: no añade autoridad.
emit_permission_overrides = true

# Vuelven a la fase de planeación. Se comparan contra el mensaje en minúsculas.
plan_triggers = [
  '^\s*/plan\b',
  '\bvolvamos a planear\b',
]

# Abren la fase de ejecución. Aquí es donde apruebas el plan y sueltas las manos:
# escribe una de estas frases en el mismo mensaje con que apruebas.
auto_triggers = [
  '^\s*/auto\b',
  '\bejec[uú]ta(?:lo)?\s+en\s+(?:modo\s+)?autom[aá]tico\b',
  '\baprobado[,:]?\s+ejec[uú]ta\b',
  '\bmodo\s+autom[aá]tico\b',
]

# Registrar también las decisiones `allow`. Ocupa más disco pero es lo que permite
# medir qué porcentaje de acciones se resuelve solo y afinar las reglas.
audit_allow = true


[classifier]
# Clasificador para el caso intermedio: todo lo que las reglas estáticas no resuelven,
# donde "peligroso" depende de la intención. Se consulta en AMBOS modos; la fase (plan o
# auto) viaja como contexto de su juicio, no como excusa para prescindir de él.
#
# El veredicto es binario, allow o deny, igual que en el auto mode de Claude Code. El
# tercer veredicto, `ask`, se retiró: se midió que bajo --dangerously-skip-permissions
# —la forma normal de trabajar— agy respeta el deny del hook pero ejecuta su ask, de modo
# que preguntar en sesión desatendida equivale a aprobar sin que nadie lo revise. Una
# denegación no es un final: el agente recibe el motivo y busca otra vía.
enabled = true

# Qué hacer cuando el clasificador no puede pronunciarse: binario ausente, timeout,
# salida ilegible. Estas denegaciones se marcan como técnicas y no cuentan para el
# cortacircuitos, porque un fallo de agy no es el agente insistiendo.
on_failure = "deny"

# El clasificador lanza el propio `agy` en modo print, con la sesión ya autenticada de la
# máquina. Cuesta ~5 s por llamada no cacheada.
[classifier.agy]
model = "gemini-3.8-flash-low"
# Margen amplio a propósito: es preferible esperar a caer en `ask` por impaciencia.
timeout_seconds = 30
binary = "agy"

# Juez de repuesto (judge_pool.py): cada conversación tiene un auxiliar que mantiene un agy
# ya arrancado, para que el juicio no pague el arranque (~7 s en frío, ~2,5 s con repuesto).
# Si el auxiliar no responde, se juzga en frío como siempre.
persistent = true
# Consultas que atiende cada juez antes de descartarse. Con 1, cada juicio empieza de cero:
# un juez reutilizado recuerda lo que el agente le hizo leer en consultas anteriores.
reuse_turns = 1
# El auxiliar se apaga tras este tiempo sin acciones; cada acción juzgada reinicia el plazo.
idle_seconds = 900

# Dónde deja agy el plan aprobado. Ese documento es la definición operativa de
# "dentro de los objetivos del trabajo" contra la que el clasificador juzga.
plan_root = "~/.gemini/antigravity-cli/brain"
plan_max_chars = 4000



[checkpoint]
# Captura del estado del proyecto antes del primer cambio destructivo de cada bloque.
# Es lo que vuelve cierta la frase "reversible por control de versiones": sin respaldo,
# esa afirmación es una suposición.
#
# Usa un índice temporal, así que no toca el índice, el stash ni la rama de la persona.
# El commit queda sin padre, apuntado por refs/automode/<conversacion>, fuera del
# historial de trabajo. Respeta .gitignore.
enabled = true

# Si no se puede respaldar (el proyecto no es un repositorio git, git no está, falla la
# escritura), `true` devuelve la decisión a la persona en vez de aprobar a ciegas.
# Ponerlo en `false` acepta trabajar sin red de seguridad.
require = true

# No se recaptura dentro de este intervalo: el objetivo es poder volver al inicio del
# bloque de trabajo, no versionar cada paso.
min_interval_seconds = 300

# Archivos más grandes que esto quedan fuera de la captura: leerlos y comprimirlos es lo
# que la vuelve lenta en proyectos con datos. El motivo de la aprobación los nombra, y la
# orden de restauración los excluye para no pisarlos. 0 captura todo.
max_file_mb = 10

# Capturas que se conservan: las de las últimas N conversaciones. Sin límite, cada
# conversación deja una para siempre y `.git` solo crece. 0 las conserva todas.
keep_last = 20


[circuit_breaker]
# Si el agente insiste en caminos prohibidos, algo va mal: la denegación se mantiene y se
# le pide que cambie de enfoque. No se escala con `force_ask`: sin supervisión agy lo
# ejecuta igual que un `ask`.
consecutive_denials = 3
total_denials = 20


[tools]
# Nivel 1 — sin efectos secundarios. Se aprueban sin más análisis.
# (Salvo que la ruta involucrada sea sensible; ver [paths].sensitive más abajo.)
read_only = [
  "view_file", "view_file_outline", "view_code_item", "view_content_chunk",
  "grep_search", "find", "find_all_references", "list_directory", "code_search",
  "read_notebook", "read_terminal", "list_resources", "read_resource",
  "retrieve_memory", "conversation_history", "tool_search", "command_status",
  "list_browser_pages", "capture_browser_console_logs", "read_browser_page",
  # Nombres reales observados en el registro de auditoría de agy.
  "find_by_name", "list_dir", "ask_question", "manage_task",
  # Temporizador con que el agente vuelve a mirar una tarea en segundo plano. No ejecuta
  # nada: lo que haga al despertar vuelve a pasar por el hook, llamada por llamada.
  "schedule",
]

# Nivel 2 — escritura. Se aprueban solo si todas las rutas caen dentro del proyecto.
write = [
  "propose_code", "file_change", "edit_notebook", "write_blob",
  # Nombres reales observados en el registro de auditoría de agy.
  "write_to_file", "replace_file_content",
]

# Nivel 3 — efectos externos o destructivos. Nunca se aprueban solas.
# Las que ejecutan comandos pasan además por el análisis de [commands].
always_evaluate = [
  "run_command", "send_command_input", "shell_exec", "execute_notebook",
  "run_extension_code", "git_commit", "delete_directory", "move",
  "invoke_subagent", "browser_subagent", "execute_browser_javascript",
  # Observadas en el corpus de la Fase 0 y extraídas del binario: la familia de
  # subagentes y el canal por el que un subagente le habla a otro agente. `send_message`
  # es salida de información, de modo que se juzga contra el objetivo del trabajo.
  "manage_subagents", "define_subagent", "send_message",
  "open_browser_url", "read_url_content", "search_web", "mcp_tool",
  "cloud_sql_execute_sql", "cloud_sql_update_schema", "set_up_cloud_sql",
  "deploy_firebase", "set_up_firebase",
  "install_applet_dependencies", "install_applet_package",
]

# Herramientas cuyos argumentos contienen comandos de shell, y el nombre del argumento
# donde vive el comando. `run_command` -> `CommandLine` está confirmado; el resto se
# descubre leyendo el registro de auditoría.
# Herramientas que borran o mueven: aunque el clasificador las apruebe, antes se
# respalda el proyecto. Son las que no se pueden deshacer con un editor.
destructive = [
  "delete_directory", "move", "delete_file", "remove_file",
]

# Claves cuyo valor es CONTENIDO, no una ruta ni un comando: el texto que se va a
# escribir dentro de un archivo, la instrucción para el editor, el mensaje a otro
# agente. Se excluyen del rastreo de rutas y de credenciales.
#
# Sin esto, escribir un `README.md` que en su texto menciona `pruebas/banco` se leía
# como "escritura fuera del proyecto" y volvía a la persona (observado dos veces en el
# corpus de la Fase 0, sesión 4a2cd8ee). El contenido no se ejecuta ni se abre: tratarlo
# como ruta solo produce fricción.
#
# Los nombres salen del registro de auditoría real de agy, no de conjeturas.
content_args = [
  "CodeContent", "ReplacementContent", "TargetContent", "Instruction",
  "Description", "Message", "ArtifactMetadata", "toolAction", "toolSummary",
]

[tools.command_arg]
run_command = "CommandLine"
shell_exec = "CommandLine"
send_command_input = "Input"


[paths]
# Rutas que el agente nunca debe tocar, ni leer ni escribir. Leer credenciales es
# exploración de credenciales aunque técnicamente sea "solo lectura".
sensitive = [
  '(^|[/\\])\.env($|[.\w]*$)',
  '(^|[/\\])\.ssh([/\\]|$)',
  '(^|[/\\])\.aws([/\\]|$)',
  '(^|[/\\])\.gnupg([/\\]|$)',
  '(^|[/\\])\.netrc$',
  '(^|[/\\])id_(rsa|ed25519|ecdsa|dsa)',
  '(^|[/\\])credentials\.json$',
  '(^|[/\\])google_accounts\.json$',
  '(^|[/\\])\.git-credentials$',
  # Secreto del juez de repuesto: quien lo lea podría firmar veredictos falsos.
  '(^|[/\\])\.gemini[/\\]automode([/\\]|$)',
]

# Auto-protección: el auto mode no puede modificarse a sí mismo. Un guardián editable no
# es un guardián, así que esta regla no admite excepciones ni configuración.
self_protected = [
  # El punto es obligatorio: sin él, cualquier carpeta `agents/` del proyecto quedaba
  # bloqueada, algo común en proyectos de agentes.
  '(?:^|[\s/\\])\.agents(?:[/\\]|$)',
  # Instalación global del auto mode (y del resto de la configuración global de agy).
  '(?:^|[\s/\\])\.gemini[/\\]config(?:[/\\]|$)',
  # Estado del juez de repuesto, con el secreto que autentica sus veredictos.
  '(?:^|[\s/\\])\.gemini[/\\]automode(?:[/\\]|$)',
]

# Términos que delatan una búsqueda de credenciales. Se comprueban en los argumentos
# de las herramientas de lectura y búsqueda: la regla equivalente de [commands] solo
# cubría comandos de shell, de modo que un `grep_search` los esquivaba.
credential_terms = [
  '\b(?:API_?KEY|SECRET|TOKEN|PASSWORD|PASSWD|PRIVATE_?KEY|CREDENTIAL)S?\b',
]

# Raíces de escritura adicionales al workspace. agy guarda sus artefactos de planeación
# en su propio directorio `brain/`, fuera del proyecto: sin esto, cada plan que escribe
# pide permiso. Se expanden variables de entorno y `~`.
# Mantener corta: cada entrada es un lugar donde el agente puede escribir sin preguntar.
extra_write_roots = [
  '~/.gemini/antigravity-cli/brain',
]




# ─────────────────────────────────────────────────────────────────────────────
# Análisis de comandos de shell
#
# El comando se descompone primero en segmentos por &&, ||, ;, | y saltos de línea.
# Si CUALQUIER segmento coincide con un patrón bloqueado, todo el comando se deniega.
# Solo si TODOS los segmentos coinciden con un patrón seguro, el comando se aprueba.
# Cualquier otro caso -> `ask`.
# ─────────────────────────────────────────────────────────────────────────────

[commands]
# Comandos inequívocamente seguros. Coinciden desde el inicio del segmento.
safe = [
  '(?:ls|dir|pwd|cd|echo|cat|type|head|tail|wc|which|where|whoami|date)\b',
  # Lecturas de PowerShell, con sus alias. Eran la consulta al juez más frecuente del
  # registro (Get-ChildItem, Test-Path): solo leen, y dentro del proyecto no hay nada
  # que juzgar. Fuera del proyecto, o con código incrustado, siguen yendo al juez.
  '(?:Get-ChildItem|gci|Get-Content|gc|Test-Path|Get-Location|gl|Resolve-Path|rvpa|Get-Item|gi|Split-Path|Join-Path)\b',
  # Cmdlets que solo dan forma a una salida dentro de una tubería (Get-ChildItem | ...).
  # Where-Object y ForEach-Object no están: su bloque de script ejecuta código.
  '(?:Select-Object|select|Sort-Object|sort|Measure-Object|measure|Format-Table|ft|Format-List|fl|Out-String|Out-Null)\b',
  # Búsqueda de texto. La búsqueda de credenciales la corta antes una regla bloqueada, y
  # `rg --pre` queda fuera porque ejecuta un programa por cada archivo.
  '(?:grep|findstr|Select-String|sls)\b',
  'rg\b(?![^|;&]*--pre)',
  '(?:git)\s+(?:status|log|diff|show|branch|remote|fetch|stash\s+list|rev-parse|describe|blame)\b',
  # `git init` es la salida que el motor le indica al agente cuando no hay repositorio y
  # por tanto no hay respaldo posible. Sin esto, ese consejo sería un callejón sin salida:
  # el agente intentaría crearlo y volvería a chocar. Crear un repositorio vacío no
  # destruye nada ni toca el historial de otro.
  '(?:git)\s+init\b',
  '(?:python|python3|py)\s+-m\s+(?:pytest|unittest)\b',
  '(?:pytest|tox|nox)\b',
  '(?:npm|pnpm|yarn)\s+(?:test|run\s+test|run\s+lint|run\s+build)\b',
  '(?:uv)\s+(?:run\s+)?(?:pytest|ruff|black)\b',
  '(?:uv)\s+run\s+(?:--with\s+[\w.-]+\s+)*(?:pytest|ruff|black)\b',
  '(?:uv\s+)?pip\s+(?:list|show|freeze)\b',
  '(?:python|python3|py)\s+-m\s+pip\s+(?:list|show|freeze)\b',
  '(?:ruff|black|isort|flake8|mypy|prettier|eslint)\b',
  '(?:node|python|python3)\s+--version\b',
  '(?:tree|du|df|stat|file)\b',
]

# Patrones peligrosos. `reason` se le devuelve al agente para que busque otra vía.
# Agrupados por lo que la acción HACE, no por su sintaxis.

# ── a) Destruir o exfiltrar ──────────────────────────────────────────────────
[[commands.blocked]]
pattern = 'git\s+push\b[^|;&]*\s(?:--force|-f)(?:\s|$)'
reason = "Force push reescribe historia publicada. Usa --force-with-lease sobre tu propia rama, o pide confirmación explícita."

[[commands.blocked]]
pattern = 'git\s+push\b[^|;&]*\s--delete\b'
reason = "Borrar ramas remotas es irreversible y puede afectar trabajo de otras personas."

[[commands.blocked]]
pattern = 'git\s+push\b[^|;&]*\s(?:origin\s+)?(?:main|master)(?:\s|$)'
reason = "Push directo a main/master elude la revisión. Trabaja sobre una rama de feature."

[[commands.blocked]]
pattern = 'git\s+(?:reset\s+--hard|clean\s+-[a-z]*f)'
reason = "Descarta cambios locales de forma irrecuperable."

[[commands.blocked]]
pattern = '\brm\s+(?:-[a-zA-Z]*[rR][a-zA-Z]*f|-[a-zA-Z]*f[a-zA-Z]*[rR])'
reason = "Borrado recursivo forzado. Verifica el alcance exacto antes de proceder."

[[commands.blocked]]
pattern = '(?:Remove-Item|ri|rd|rmdir)\b[^|;&]*-Recurse[^|;&]*-Force'
reason = "Borrado recursivo forzado en PowerShell."

[[commands.blocked]]
pattern = '\bdel\s+/[fs]|/s\s+/q|\bformat\s+[a-z]:'
reason = "Borrado masivo en Windows."

[[commands.blocked]]
pattern = '\bgh\s+gist\s+create|\bcurl\b[^|;&]*(?:pastebin|transfer\.sh|0x0\.st|file\.io)'
reason = "Publica contenido del proyecto en un servicio externo. Riesgo de exfiltración."

[[commands.blocked]]
pattern = '\bcurl\b[^|;&]*\s(?:-d|--data|-F|--form|-T|--upload-file)\s*@'
reason = "Sube el contenido de un archivo local a una URL externa."

[[commands.blocked]]
pattern = '\b(?:npm\s+publish|twine\s+upload|cargo\s+publish|gem\s+push)\b'
reason = "Publica un paquete. Es irreversible y de alcance público."

# ── b) Degradar la postura de seguridad ──────────────────────────────────────
[[commands.blocked]]
pattern = '>>?\s*[^|;&]*authorized_keys|ssh-copy-id\b'
reason = "Añade acceso SSH persistente."

[[commands.blocked]]
# `at` solo cuenta como comando: al inicio de un segmento y seguido de una hora o un equipo
# (`at 14:00 ...`, `at \\pc ...`). Sin esa exigencia, "# Look at lines" o "Event at index"
# dentro de un `python -c` se leían como tareas programadas (conversación 68da1f0a, s36).
pattern = '\b(?:crontab|schtasks)\b|(?:^|[;&|\n"\x27(]\s*)at\s+(?:\d|\\\\)|New-ScheduledTask'
reason = "Crea ejecución programada persistente."

[[commands.blocked]]
pattern = '\bchmod\s+(?:-R\s+)?777\b|Set-ExecutionPolicy\s+(?:Bypass|Unrestricted)'
reason = "Relaja permisos del sistema."

[[commands.blocked]]
pattern = 'Add-MpPreference\s+-ExclusionPath|Set-MpPreference\s+-Disable'
reason = "Desactiva protecciones de Windows Defender."

# ── c) Cruzar la frontera de confianza ───────────────────────────────────────
[[commands.blocked]]
pattern = '\b(?:curl|wget|iwr|Invoke-WebRequest)\b[^|;&]*\|\s*(?:sudo\s+)?(?:sh|bash|zsh|python|iex|Invoke-Expression)'
reason = "Descarga y ejecuta código remoto sin inspección previa."

[[commands.blocked]]
pattern = '(?:grep|rg|findstr|Select-String)\b[^|;&]*(?:API_KEY|SECRET|TOKEN|PASSWORD|PRIVATE_KEY|CREDENTIAL)'
reason = "Búsqueda de credenciales. Si necesitas una, pídela explícitamente."

# ── d) Eludir revisión o afectar recursos compartidos ────────────────────────
[[commands.blocked]]
pattern = '\s(?:--no-verify|--skip-verification|--skip-checks|--allow-unrelated-histories)\b'
reason = "Elude una verificación de seguridad. Si la verificación falló, corrige la causa."

[[commands.blocked]]
pattern = '\bkubectl\s+(?:delete|drain)\b|\bterraform\s+(?:apply|destroy)\b'
reason = "Modifica infraestructura compartida."

[[commands.blocked]]
pattern = '\b(?:DROP|TRUNCATE)\s+(?:TABLE|DATABASE|SCHEMA)\b|\bDELETE\s+FROM\b(?![^|;&]*\bWHERE\b)'
reason = "Operación destructiva de base de datos."

[[commands.blocked]]
pattern = '\bdocker\s+(?:system\s+prune|volume\s+rm)|\bdocker\s+rm\s+-f'
reason = "Elimina recursos de Docker que pueden estar en uso."

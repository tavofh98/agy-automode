# Política del auto mode de agy: lo único que hay que editar para ajustar su comportamiento.
# Las cadenas van entre comillas simples para que las barras de las regex se tomen literales.

[mode]
# Modo fijo si la conversación no indica otro: "plan" (las ediciones las juzga el clasificador)
# o "auto" (las ediciones dentro del proyecto se aprueban, con captura previa).
active = "auto"

# La fase se deduce de lo que escribe la persona (`/plan`, frase de aprobación).
# Precedencia: AGY_MODE > conversación > `active`.
follow_conversation = true

# Acompaña cada `allow` de un comando con `permissionOverrides` del comando exacto, para que
# agy no vuelva a preguntar en su modo plan.
emit_permission_overrides = true

# Vuelven a la fase de planeación. Se comparan contra el mensaje en minúsculas.
plan_triggers = [
  '^\s*/plan\b',
  '\bvolvamos a planear\b',
]

# Abren la fase de ejecución. Aquí es donde apruebas el plan y sueltas las manos:
# escribe una de estas frases en el mismo mensaje con que apruebas.
auto_triggers = [
  '^\s*/auto\b',
  '\bejec[uú]ta(?:lo)?\s+en\s+(?:modo\s+)?autom[aá]tico\b',
  '\baprobado[,:]?\s+ejec[uú]ta\b',
  '\bmodo\s+autom[aá]tico\b',
]

# Registrar también las decisiones `allow`. Ocupa más disco pero es lo que permite
# medir qué porcentaje de acciones se resuelve solo y afinar las reglas.
audit_allow = true


[classifier]
# Juez para lo que las reglas no resuelven, en ambos modos. Veredicto binario: allow o deny
# (ver docs/findings.md sobre por qué no existe `ask`).
enabled = true

# Si el juez no puede pronunciarse (timeout, salida ilegible): deniega, sin contar para el cortacircuitos.
on_failure = "deny"

# El clasificador lanza el propio `agy` en modo print, con la sesión ya autenticada de la
# máquina. Cuesta ~5 s por llamada no cacheada.
[classifier.agy]
model = "gemini-3.8-flash-low"
# Margen amplio a propósito: es preferible esperar a caer en `ask` por impaciencia.
timeout_seconds = 30
binary = "agy"

# Juez precargado (judge_pool.py): un agy ya arrancado por conversación; si falla, se juzga en frío.
persistent = true
# Consultas por juez antes de descartarlo. Con 1, ningún juicio recuerda los anteriores.
reuse_turns = 1
# El auxiliar se apaga tras este tiempo sin acciones juzgadas.
idle_seconds = 900

# Dónde deja agy el plan aprobado. Ese documento es la definición operativa de
# "dentro de los objetivos del trabajo" contra la que el clasificador juzga.
plan_root = "~/.gemini/antigravity-cli/brain"
plan_max_chars = 4000



[checkpoint]
# Captura git del proyecto antes del primer cambio de cada bloque de trabajo, en
# refs/automode/<conversación>, sin tocar la rama ni el índice. Respeta .gitignore.
enabled = true

# Sin captura posible (p. ej. sin repositorio git), `true` deniega la edición; `false` la permite.
require = true

# No se recaptura dentro de este intervalo: el objetivo es poder volver al inicio del
# bloque de trabajo, no versionar cada paso.
min_interval_seconds = 300

# Archivos más grandes que esto quedan fuera de la captura y el motivo los nombra. 0 captura todo.
max_file_mb = 10

# Capturas que se conservan: las de las últimas N conversaciones. Sin límite, cada
# conversación deja una para siempre y `.git` solo crece. 0 las conserva todas.
keep_last = 20


[circuit_breaker]
# Si el agente insiste en caminos prohibidos, se mantiene la denegación y se le pide parar.
consecutive_denials = 3
total_denials = 20


[tools]
# Nivel 1 — sin efectos secundarios. Se aprueban sin más análisis.
# (Salvo que la ruta involucrada sea sensible; ver [paths].sensitive más abajo.)
read_only = [
  "view_file", "view_file_outline", "view_code_item", "view_content_chunk",
  "grep_search", "find", "find_all_references", "list_directory", "code_search",
  "read_notebook", "read_terminal", "list_resources", "read_resource",
  "retrieve_memory", "conversation_history", "tool_search", "command_status",
  "list_browser_pages", "capture_browser_console_logs", "read_browser_page",
  # Nombres reales observados en el registro de auditoría de agy.
  "find_by_name", "list_dir", "ask_question", "manage_task",
  # Temporizador con que el agente vuelve a mirar una tarea en segundo plano. No ejecuta
  # nada: lo que haga al despertar vuelve a pasar por el hook, llamada por llamada.
  "schedule",
]

# Nivel 2 — escritura. Se aprueban solo si todas las rutas caen dentro del proyecto.
write = [
  "propose_code", "file_change", "edit_notebook", "write_blob",
  # Nombres reales observados en el registro de auditoría de agy.
  "write_to_file", "replace_file_content",
]

# Nivel 3 — efectos externos o destructivos. Nunca se aprueban solas.
# Las que ejecutan comandos pasan además por el análisis de [commands].
always_evaluate = [
  "run_command", "send_command_input", "shell_exec", "execute_notebook",
  "run_extension_code", "git_commit", "delete_directory", "move",
  "invoke_subagent", "browser_subagent", "execute_browser_javascript",
  # Subagentes y mensajes entre agentes: salida de información, se juzga contra la tarea.
  "manage_subagents", "define_subagent", "send_message",
  "open_browser_url", "read_url_content", "search_web", "mcp_tool",
  "cloud_sql_execute_sql", "cloud_sql_update_schema", "set_up_cloud_sql",
  "deploy_firebase", "set_up_firebase",
  "install_applet_dependencies", "install_applet_package",
]

# Herramientas que borran o mueven: aunque el juez las apruebe, antes se captura el proyecto.
destructive = [
  "delete_directory", "move", "delete_file", "remove_file",
]

# Claves cuyo valor es contenido (texto a escribir, mensajes), no rutas: no se rastrean.
content_args = [
  "CodeContent", "ReplacementContent", "TargetContent", "Instruction",
  "Description", "Message", "ArtifactMetadata", "toolAction", "toolSummary",
]

# Herramientas que ejecutan comandos de shell y el argumento donde viene el comando.
[tools.command_arg]
run_command = "CommandLine"
shell_exec = "CommandLine"
send_command_input = "Input"


[paths]
# Rutas que el agente nunca debe tocar, ni leer ni escribir. Leer credenciales es
# exploración de credenciales aunque técnicamente sea "solo lectura".
sensitive = [
  '(^|[/\\])\.env($|[.\w]*$)',
  '(^|[/\\])\.ssh([/\\]|$)',
  '(^|[/\\])\.aws([/\\]|$)',
  '(^|[/\\])\.gnupg([/\\]|$)',
  '(^|[/\\])\.netrc$',
  '(^|[/\\])id_(rsa|ed25519|ecdsa|dsa)',
  '(^|[/\\])credentials\.json$',
  '(^|[/\\])google_accounts\.json$',
  '(^|[/\\])\.git-credentials$',
  # Secreto del juez precargado: quien lo lea podría firmar veredictos falsos.
  '(^|[/\\])\.gemini[/\\]automode([/\\]|$)',
]

# Auto-protección: el auto mode no puede modificarse a sí mismo. Un guardián editable no
# es un guardián, así que esta regla no admite excepciones ni configuración.
self_protected = [
  # El punto es obligatorio: sin él, cualquier carpeta `agents/` del proyecto quedaba
  # bloqueada, algo común en proyectos de agentes.
  '(?:^|[\s/\\])\.agents(?:[/\\]|$)',
  # Instalación global del auto mode (y del resto de la configuración global de agy).
  '(?:^|[\s/\\])\.gemini[/\\]config(?:[/\\]|$)',
  # Estado del juez precargado, con el secreto que autentica sus veredictos.
  '(?:^|[\s/\\])\.gemini[/\\]automode(?:[/\\]|$)',
]

# Términos que delatan una búsqueda de credenciales en las herramientas de lectura y búsqueda.
credential_terms = [
  '\b(?:API_?KEY|SECRET|TOKEN|PASSWORD|PASSWD|PRIVATE_?KEY|CREDENTIAL)S?\b',
]

# Dónde más puede escribir el agente sin juez: `brain/`, donde agy guarda sus planes.
# Mantener corta: cada entrada es un lugar sin revisión.
extra_write_roots = [
  '~/.gemini/antigravity-cli/brain',
]




# ─────────────────────────────────────────────────────────────────────────────
# Análisis de comandos de shell
#
# El comando se parte en segmentos (&&, ||, ;, |). Si alguno está bloqueado, se deniega;
# si todos son seguros, se aprueba; si no, lo juzga el clasificador.
# ─────────────────────────────────────────────────────────────────────────────

[commands]
# Comandos inequívocamente seguros. Coinciden desde el inicio del segmento.
safe = [
  '(?:ls|dir|pwd|cd|echo|cat|type|head|tail|wc|which|where|whoami|date)\b',
  # Lecturas de PowerShell con sus alias; fuera del proyecto o con código incrustado, al juez.
  '(?:Get-ChildItem|gci|Get-Content|gc|Test-Path|Get-Location|gl|Resolve-Path|rvpa|Get-Item|gi|Split-Path|Join-Path)\b',
  # Cmdlets que solo dan forma a una salida dentro de una tubería (Get-ChildItem | ...).
  # Where-Object y ForEach-Object no están: su bloque de script ejecuta código.
  '(?:Select-Object|select|Sort-Object|sort|Measure-Object|measure|Format-Table|ft|Format-List|fl|Out-String|Out-Null)\b',
  # Búsqueda de texto. La búsqueda de credenciales la corta antes una regla bloqueada, y
  # `rg --pre` queda fuera porque ejecuta un programa por cada archivo.
  '(?:grep|findstr|Select-String|sls)\b',
  'rg\b(?![^|;&]*--pre)',
  '(?:git)\s+(?:status|log|diff|show|branch|remote|fetch|stash\s+list|rev-parse|describe|blame)\b',
  # `git init` es lo que el motor le pide al agente cuando no hay repositorio.
  '(?:git)\s+init\b',
  '(?:python|python3|py)\s+-m\s+(?:pytest|unittest)\b',
  '(?:pytest|tox|nox)\b',
  '(?:npm|pnpm|yarn)\s+(?:test|run\s+test|run\s+lint|run\s+build)\b',
  '(?:uv)\s+(?:run\s+)?(?:pytest|ruff|black)\b',
  '(?:uv)\s+run\s+(?:--with\s+[\w.-]+\s+)*(?:pytest|ruff|black)\b',
  '(?:uv\s+)?pip\s+(?:list|show|freeze)\b',
  '(?:python|python3|py)\s+-m\s+pip\s+(?:list|show|freeze)\b',
  '(?:ruff|black|isort|flake8|mypy|prettier|eslint)\b',
  '(?:node|python|python3)\s+--version\b',
  '(?:tree|du|df|stat|file)\b',
]

# Patrones peligrosos. `reason` se le devuelve al agente para que busque otra vía.
# Agrupados por lo que la acción HACE, no por su sintaxis.

# ── a) Destruir o exfiltrar ──────────────────────────────────────────────────
[[commands.blocked]]
pattern = 'git\s+push\b[^|;&]*\s(?:--force|-f)(?:\s|$)'
reason = "Force push reescribe historia publicada. Usa --force-with-lease sobre tu propia rama, o pide confirmación explícita."

[[commands.blocked]]
pattern = 'git\s+push\b[^|;&]*\s--delete\b'
reason = "Borrar ramas remotas es irreversible y puede afectar trabajo de otras personas."

[[commands.blocked]]
pattern = 'git\s+push\b[^|;&]*\s(?:origin\s+)?(?:main|master)(?:\s|$)'
reason = "Push directo a main/master elude la revisión. Trabaja sobre una rama de feature."

[[commands.blocked]]
pattern = 'git\s+(?:reset\s+--hard|clean\s+-[a-z]*f)'
reason = "Descarta cambios locales de forma irrecuperable."

[[commands.blocked]]
pattern = '\brm\s+(?:-[a-zA-Z]*[rR][a-zA-Z]*f|-[a-zA-Z]*f[a-zA-Z]*[rR])'
reason = "Borrado recursivo forzado. Verifica el alcance exacto antes de proceder."

[[commands.blocked]]
pattern = '(?:Remove-Item|ri|rd|rmdir)\b[^|;&]*-Recurse[^|;&]*-Force'
reason = "Borrado recursivo forzado en PowerShell."

[[commands.blocked]]
pattern = '\bdel\s+/[fs]|/s\s+/q|\bformat\s+[a-z]:'
reason = "Borrado masivo en Windows."

[[commands.blocked]]
pattern = '\bgh\s+gist\s+create|\bcurl\b[^|;&]*(?:pastebin|transfer\.sh|0x0\.st|file\.io)'
reason = "Publica contenido del proyecto en un servicio externo. Riesgo de exfiltración."

[[commands.blocked]]
pattern = '\bcurl\b[^|;&]*\s(?:-d|--data|-F|--form|-T|--upload-file)\s*@'
reason = "Sube el contenido de un archivo local a una URL externa."

[[commands.blocked]]
pattern = '\b(?:npm\s+publish|twine\s+upload|cargo\s+publish|gem\s+push)\b'
reason = "Publica un paquete. Es irreversible y de alcance público."

# ── b) Degradar la postura de seguridad ──────────────────────────────────────
[[commands.blocked]]
pattern = '>>?\s*[^|;&]*authorized_keys|ssh-copy-id\b'
reason = "Añade acceso SSH persistente."

[[commands.blocked]]
# `at` solo como comando: al inicio de un segmento y seguido de una hora o un equipo.
pattern = '\b(?:crontab|schtasks)\b|(?:^|[;&|\n"\x27(]\s*)at\s+(?:\d|\\\\)|New-ScheduledTask'
reason = "Crea ejecución programada persistente."

[[commands.blocked]]
pattern = '\bchmod\s+(?:-R\s+)?777\b|Set-ExecutionPolicy\s+(?:Bypass|Unrestricted)'
reason = "Relaja permisos del sistema."

[[commands.blocked]]
pattern = 'Add-MpPreference\s+-ExclusionPath|Set-MpPreference\s+-Disable'
reason = "Desactiva protecciones de Windows Defender."

# ── c) Cruzar la frontera de confianza ───────────────────────────────────────
[[commands.blocked]]
pattern = '\b(?:curl|wget|iwr|Invoke-WebRequest)\b[^|;&]*\|\s*(?:sudo\s+)?(?:sh|bash|zsh|python|iex|Invoke-Expression)'
reason = "Descarga y ejecuta código remoto sin inspección previa."

[[commands.blocked]]
pattern = '(?:grep|rg|findstr|Select-String)\b[^|;&]*(?:API_KEY|SECRET|TOKEN|PASSWORD|PRIVATE_KEY|CREDENTIAL)'
reason = "Búsqueda de credenciales. Si necesitas una, pídela explícitamente."

# ── d) Eludir revisión o afectar recursos compartidos ────────────────────────
[[commands.blocked]]
pattern = '\s(?:--no-verify|--skip-verification|--skip-checks|--allow-unrelated-histories)\b'
reason = "Elude una verificación de seguridad. Si la verificación falló, corrige la causa."

[[commands.blocked]]
pattern = '\bkubectl\s+(?:delete|drain)\b|\bterraform\s+(?:apply|destroy)\b'
reason = "Modifica infraestructura compartida."

[[commands.blocked]]
pattern = '\b(?:DROP|TRUNCATE)\s+(?:TABLE|DATABASE|SCHEMA)\b|\bDELETE\s+FROM\b(?![^|;&]*\bWHERE\b)'
reason = "Operación destructiva de base de datos."

[[commands.blocked]]
pattern = '\bdocker\s+(?:system\s+prune|volume\s+rm)|\bdocker\s+rm\s+-f'
reason = "Elimina recursos de Docker que pueden estar en uso."
